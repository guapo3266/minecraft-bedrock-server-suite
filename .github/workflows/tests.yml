name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Lint estatico (ruff)
        run: python -m ruff check .
      - name: Tests (sin e2e) + cobertura
        run: >
          python -m pytest tests -m "not e2e" -q
          --cov=gui_backend --cov=auto_backup --cov=wrapper_backup
          --cov=wrapper_events --cov=wrapper_schedule --cov=wrapper_state
          --cov=wrapper_console --cov=zip_safety --cov=console_lang
          --cov-report=term-missing:skip-covered
        env:
          PYTHONIOENCODING: utf-8

  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui_frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: gui_frontend
        run: npm ci
      - name: Lint (oxlint)
        working-directory: gui_frontend
        run: npm run lint
