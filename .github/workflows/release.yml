name: Release Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui_frontend/package-lock.json
      - name: Instalar dependencias de validación
        run: python -m pip install -r requirements-release.txt -r requirements-dev.txt
      - name: Coherencia y pruebas sin operaciones Minecraft
        run: |
          python tools/set_version.py --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest tests -m "not e2e" -q
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Frontend
        run: |
          npm --prefix gui_frontend ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix gui_frontend run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix gui_frontend test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix gui_frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Comprobar tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $suiteVersion = (Get-Content version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$suiteVersion") { throw "Tag y versión no coinciden" }
      - name: Construir ZIP con Python incluido
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: BedrockSuite-Windows-x64
          path: |
            output/releases/BedrockSuite-Windows-x64.zip
            output/releases/BedrockSuite-Windows-x64.zip.sha256
      - name: Publicar Release al ejecutar manualmente sobre un tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_notes.py --output output/releases/NOTAS.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release create $env:GITHUB_REF_NAME output/releases/BedrockSuite-Windows-x64.zip output/releases/BedrockSuite-Windows-x64.zip.sha256 --verify-tag --title "Bedrock Suite $env:GITHUB_REF_NAME" --notes-file output/releases/NOTAS.md --latest
