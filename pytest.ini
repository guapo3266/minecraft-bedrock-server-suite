[pytest]
testpaths = tests
xfail_strict = true
# Cualquier warning falla (incluye ResourceWarning por handles sin cerrar y
# PytestUnraisableExceptionWarning). Si una dependencia empieza a emitir un
# warning ajeno al repo, agregar aqui un ignore puntual y justificarlo.
filterwarnings =
    error
    # starlette (>=0.47.x) emite StarletteDeprecationWarning cuando el
    # testclient usa httpx en lugar de httpx2; hasta migrar dependencias
    # (httpx es la version pinneada en requirements-dev.txt), ignorar SOLO
    # ese aviso. Verificado 2026-09-11: sin el ignore, TODOS los tests con
    # TestClient fallen por filterwarnings=error.
    ignore:Using .httpx. with .starlette\.testclient. is deprecated:
markers =
    e2e: pruebas de extremo a extremo con el servidor real (BDS) o red real
