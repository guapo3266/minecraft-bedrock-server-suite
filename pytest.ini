[pytest]
testpaths = tests
xfail_strict = true
# Cualquier warning falla (incluye ResourceWarning por handles sin cerrar y
# PytestUnraisableExceptionWarning). Si una dependencia empieza a emitir un
# warning ajeno al repo, agregar aqui un ignore puntual y justificarlo.
filterwarnings =
    error
markers =
    e2e: pruebas de extremo a extremo con el servidor real (BDS) o red real
